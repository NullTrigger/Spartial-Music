<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spartial Music — preview</title>
<style>
  :root {
    --black: #07080a;
    --surface: #131418;
    --surface-high: #1b1d22;
    --surface-highest: #282a30;
    --white: #f6f6f7;
    --grey: #9fa1a8;
    --dim: #6a6c74;
    --line: rgba(255,255,255,.10);
    --accent: #f1f2f4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: var(--black); }
  body {
    font-family: "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    color: var(--white);
    -webkit-font-smoothing: antialiased;
  }
  .phone {
    position: relative;
    width: 440px;
    height: 960px;
    overflow: hidden;
    background:
      radial-gradient(120% 55% at 50% 0%, rgba(55,72,100,.22), transparent 60%),
      var(--black);
  }
  .status {
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    font-size: 12px;
    font-weight: 600;
    color: #d8d9dd;
    letter-spacing: .2px;
  }
  .status .icons { display: flex; gap: 5px; align-items: center; opacity: .85; }
  .status .icons i { display: block; width: 14px; height: 9px; border: 1px solid #d8d9dd; border-radius: 2px; position: relative; }
  .status .icons i::after { content: ""; position: absolute; inset: 2px; background: #d8d9dd; border-radius: 1px; }
  .status .icons b { display: block; width: 3px; height: 9px; background: #d8d9dd; border-radius: 1px; }

  .scroll { height: 820px; overflow: hidden; }
  .home .scroll { height: 762px; }
  .pad { padding: 0 22px; }
  .eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--dim);
    text-transform: uppercase;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 22px 18px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; }
  .brand span { font-size: 21px; font-weight: 700; letter-spacing: -.4px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line);
    background: linear-gradient(145deg, #2c3038, #121317);
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700; color: #dfe0e4;
  }
  .hero {
    position: relative;
    height: 254px;
    margin: 0 22px 20px;
    border-radius: 28px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.12);
    background:
      radial-gradient(70% 90% at 20% 15%, rgba(102,141,180,.55), transparent 60%),
      radial-gradient(80% 90% at 85% 85%, rgba(141,95,156,.50), transparent 62%),
      linear-gradient(140deg, #1a2230, #0b1018 55%, #141021);
    box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(7,8,10,.05) 25%, rgba(7,8,10,.88) 100%);
  }
  .hero-art {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 12px; opacity: .18;
  }
  .hero-art i { display: block; width: 26px; border-radius: 999px; background: #fff; }
  .hero-art i:nth-child(1) { height: 96px; }
  .hero-art i:nth-child(2) { height: 210px; }
  .hero-art i:nth-child(3) { height: 260px; }
  .hero-art i:nth-child(4) { height: 210px; }
  .hero-art i:nth-child(5) { height: 96px; }
  .hero-body { position: absolute; left: 20px; right: 20px; bottom: 18px; z-index: 2; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(18,20,24,.55);
    font-size: 9px; font-weight: 700; letter-spacing: 1.2px;
  }
  .hero-title { font-size: 28px; font-weight: 700; letter-spacing: -.7px; margin: 10px 0 3px; }
  .hero-meta { font-size: 11px; color: var(--grey); }
  .play-pill {
    position: absolute; right: 18px; bottom: 18px; z-index: 2;
    display: flex; align-items: center; gap: 7px;
    background: var(--white); color: #08090b;
    border-radius: 999px; padding: 10px 16px;
    font-size: 12px; font-weight: 700;
  }
  .play-pill svg { width: 12px; height: 12px; }

  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 0 22px 12px;
  }
  .section-head h2 { margin: 0; font-size: 17px; letter-spacing: -.25px; }
  .section-head a { color: var(--grey); font-size: 10px; font-weight: 600; text-decoration: none; }
  .rail { display: flex; gap: 12px; padding: 0 22px 22px; }
  .tile { width: 112px; flex: 0 0 auto; }
  .cover {
    width: 112px; height: 112px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,.09);
    display: grid; place-items: center;
    font-family: Georgia, serif; font-size: 38px; color: rgba(255,255,255,.55);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  }
  .c1 { background: radial-gradient(75% 75% at 30% 25%, #6d7fa0, #171c26 72%); }
  .c2 { background: radial-gradient(75% 75% at 70% 25%, #8a6d9e, #1b1622 72%); }
  .c3 { background: radial-gradient(75% 75% at 40% 75%, #4f8a83, #101b1a 72%); }
  .c4 { background: radial-gradient(75% 75% at 30% 30%, #b08a62, #211912 72%); }
  .tile .t { margin-top: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .s { margin-top: 2px; font-size: 10px; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .rows { padding: 0 22px 20px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 7px 0; }
  .row .cover { width: 48px; height: 48px; border-radius: 12px; font-size: 18px; }
  .row .txt { min-width: 0; flex: 1; }
  .row .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { font-size: 10px; color: var(--grey); margin-top: 2px; }
  .row .more { color: var(--dim); font-size: 16px; letter-spacing: 2px; }

  .mini {
    position: absolute; left: 14px; right: 14px; bottom: 84px;
    height: 58px; border-radius: 18px;
    border: 1px solid rgba(255,255,255,.12);
    background: linear-gradient(180deg, rgba(38,41,48,.94), rgba(20,22,26,.96));
    box-shadow: 0 14px 36px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    display: flex; align-items: center; gap: 10px;
    padding: 0 12px;
  }
  .mini .cover { width: 38px; height: 38px; border-radius: 10px; font-size: 14px; }
  .mini .txt { flex: 1; min-width: 0; }
  .mini .t { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .s { font-size: 9px; color: var(--grey); margin-top: 1px; }
  .icon-btn { width: 30px; height: 30px; display: grid; place-items: center; color: var(--white); }
  .icon-btn svg { width: 16px; height: 16px; }

  .tabs {
    position: absolute; left: 14px; right: 14px; bottom: 12px;
    height: 62px; border-radius: 24px;
    border: 1px solid rgba(255,255,255,.12);
    background: linear-gradient(180deg, rgba(34,37,43,.94), rgba(17,19,23,.96));
    box-shadow: 0 18px 44px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: space-around;
    padding: 0 8px;
  }
  .tab { width: 74px; height: 46px; border-radius: 16px; display: grid; place-items: center; gap: 1px; color: var(--dim); font-size: 8px; font-weight: 600; }
  .tab svg { width: 18px; height: 18px; }
  .tab.on { color: #101115; background: var(--white); box-shadow: 0 6px 18px rgba(0,0,0,.35); }

  /* player */
  .player { background: radial-gradient(130% 70% at 50% 22%, #2a3446 0%, #10141b 42%, #07080a 78%); }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 22px 12px; color: var(--grey); }
  .topbar .title { font-size: 10px; font-weight: 700; letter-spacing: 1.8px; }
  .topbar svg { width: 18px; height: 18px; }
  .art {
    position: relative;
    height: 378px; margin: 10px 30px 26px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,.14);
    background:
      radial-gradient(70% 80% at 22% 18%, #536a8f 0%, transparent 58%),
      radial-gradient(75% 85% at 82% 82%, #6f4f78 0%, transparent 60%),
      linear-gradient(145deg, #18202d, #0a0d12 62%, #120e19);
    box-shadow: 0 34px 80px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.10);
    overflow: hidden;
  }
  .art .bars { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 14px; opacity: .13; }
  .art .bars i { display: block; width: 28px; border-radius: 999px; background: #fff; }
  .art .bars i:nth-child(1) { height: 110px; }
  .art .bars i:nth-child(2) { height: 230px; }
  .art .bars i:nth-child(3) { height: 286px; }
  .art .bars i:nth-child(4) { height: 230px; }
  .art .bars i:nth-child(5) { height: 110px; }
  .np-info { padding: 0 32px; }
  .np-title { font-size: 30px; font-weight: 700; letter-spacing: -.8px; }
  .np-meta { margin-top: 6px; color: var(--grey); font-size: 12px; }
  .seek { margin-top: 24px; }
  .bar { height: 4px; border-radius: 999px; background: rgba(255,255,255,.16); overflow: hidden; }
  .bar > i { display: block; width: 38%; height: 100%; border-radius: 999px; background: var(--white); }
  .times { display: flex; justify-content: space-between; color: var(--dim); font-size: 9px; margin-top: 7px; }
  .controls { display: flex; align-items: center; justify-content: space-between; padding: 22px 32px 0; }
  .controls > div { display: grid; place-items: center; color: var(--white); }
  .controls > div svg { width: 22px; height: 22px; }
  .controls .small { color: var(--grey); }
  .controls .small svg { width: 20px; height: 20px; }
  .controls .big {
    width: 68px; height: 68px; border-radius: 50%;
    background: var(--white); color: #08090b;
    display: grid; place-items: center;
    box-shadow: 0 12px 28px rgba(0,0,0,.45);
  }
  .controls .big svg { width: 24px; height: 24px; }
  .upnext {
    margin: 30px 22px 0; padding: 14px 16px;
    border-radius: 22px; border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(34,37,43,.72), rgba(16,18,22,.82));
  }
  .upnext .eyebrow { margin-bottom: 8px; }
  .upnext .row { padding: 6px 0; }
  .upnext .cover { width: 38px; height: 38px; border-radius: 9px; font-size: 14px; }

  /* now playing — full-bleed gradient player */
  .np { background: #245a79; color: #f6fcff; }
  .np-cover {
    position: absolute; inset: 0 0 auto 0; height: 660px;
    background:
      radial-gradient(80% 70% at 50% 16%, rgba(255,255,255,.22), transparent 60%),
      radial-gradient(70% 90% at 18% 30%, rgba(150,214,241,.62), transparent 58%),
      radial-gradient(90% 100% at 80% 18%, rgba(73,145,184,.72), transparent 62%),
      linear-gradient(160deg, #4d8eb4, #245a79 72%);
  }
  .np-bars { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 13px; opacity: .17; }
  .np-bars i { display: block; width: 24px; border-radius: 999px; background: #fff; }
  .np-bars i:nth-child(1) { height: 92px; }
  .np-bars i:nth-child(2) { height: 190px; }
  .np-bars i:nth-child(3) { height: 252px; }
  .np-bars i:nth-child(4) { height: 190px; }
  .np-bars i:nth-child(5) { height: 92px; }
  .np-shade {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(4,10,16,.34) 0%, transparent 18%, transparent 38%,
      rgba(33,82,112,.58) 56%, #2b6b90 72%, #245a79 100%);
  }
  .np-top { position: absolute; top: 50px; left: 18px; right: 18px; display: flex; align-items: center; justify-content: space-between; }
  .np-back { width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,.18); display: grid; place-items: center; }
  .np-back svg { width: 20px; height: 20px; }
  .np-source { font-size: 8px; font-weight: 700; letter-spacing: 1.5px; padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.24); background: rgba(255,255,255,.09); }
  /* the band of empty backdrop below the transport row, matching the app:
     the reference player leaves about 5% of the screen height there */
  .np-content { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 24px 48px; }
  .np-title { text-align: center; font-size: 30px; font-weight: 700; letter-spacing: -.7px; }
  .np-artist { text-align: center; margin-top: 5px; color: rgba(246,252,255,.78); font-size: 13px; }
  .np-actions { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
  .np-circle { width: 52px; height: 52px; flex: 0 0 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.10); display: grid; place-items: center; }
  .np-pill { flex: 1; height: 52px; border-radius: 999px; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.10); display: flex; align-items: center; justify-content: space-evenly; }
  .np-circle svg, .np-pill svg { width: 20px; height: 20px; }
  .np-progress { margin-top: 18px; }
  .np-progress .bar { height: 3px; background: rgba(255,255,255,.22); }
  .np-progress .bar > i { width: 34%; background: #bfeaff; }
  .np-times { display: flex; align-items: center; justify-content: space-between; margin-top: 7px; color: rgba(246,252,255,.70); font-size: 10px; }
  .np-format { display: flex; align-items: center; gap: 4px; font-size: 8px; letter-spacing: 1.1px; color: rgba(246,252,255,.62); }
  .np-format svg { width: 12px; height: 12px; }
  .np-transport { display: flex; align-items: center; justify-content: space-between; margin-top: 17px; color: #c9edff; }
  .np-transport svg { width: 25px; height: 25px; }
  .np-transport .dim { color: rgba(246,252,255,.58); }
  .np-transport .np-play { width: 64px; height: 64px; border-radius: 50%; border: 1px solid rgba(255,255,255,.24); background: rgba(255,255,255,.08); display: grid; place-items: center; }
  .np-transport .np-play svg { width: 34px; height: 34px; color: #c9edff; }

  /* library */
  .lib-title { padding: 4px 22px 6px; font-size: 36px; font-weight: 700; letter-spacing: -1.2px; }
  .lib-sub { padding: 0 22px 18px; color: var(--grey); font-size: 11px; }
  .search {
    margin: 0 22px 18px; height: 44px; border-radius: 15px;
    border: 1px solid var(--line); background: rgba(255,255,255,.055);
    display: flex; align-items: center; gap: 9px; padding: 0 14px;
    color: var(--dim); font-size: 12px;
  }
  .search svg { width: 15px; height: 15px; }
  .chips { display: flex; gap: 8px; padding: 0 22px 20px; }
  .chip { padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); color: var(--grey); font-size: 10px; font-weight: 600; }
  .chip.on { background: var(--white); color: #0b0c0e; border-color: var(--white); }
  .lib-grid { display: flex; gap: 12px; padding: 0 22px 22px; }
  .lib-grid .tile, .lib-grid .cover { width: 112px; }
  .list-card {
    margin: 0 22px 18px; border-radius: 22px; border: 1px solid var(--line);
    background: rgba(255,255,255,.035); padding: 6px 14px;
  }
  .list-card .row { border-bottom: 1px solid rgba(255,255,255,.055); }
  .list-card .row:last-child { border-bottom: 0; }
  .list-card .cover { width: 42px; height: 42px; border-radius: 11px; font-size: 15px; }
  .badge { font-size: 9px; color: var(--dim); border: 1px solid var(--line); padding: 3px 7px; border-radius: 999px; }
</style>
</head>
<body>
<div class="phone" id="screen"></div>
<script>
  const play = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72L19 12z"/></svg>';
  const pause = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.2v14H7zM13.8 5H17v14h-3.2z"/></svg>';
  const home = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 10.5 8-6.5 8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>';
  const flame = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21c4 0 6-2.6 6-6.2 0-3.2-2.3-5.4-4.2-7.3C12.3 5.9 11 4.4 11 2c-3 2.6-5 6.2-5 10.2C6 17.4 8.3 21 12 21Z"/><path d="M12 21c1.9 0 3-1.4 3-3.2 0-2-1.8-3.2-3-5.2-1.2 2-3 3.2-3 5.2C9 19.6 10.1 21 12 21Z"/></svg>';
  const spark = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="m19 16 .8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>';
  const library = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4v16M8 4v16M12 5v14l8-4V9z"/></svg>';
  const search = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>';
  const settings = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>';
  const more = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>';
  const heart = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20S4 15.2 4 9.6A4.6 4.6 0 0 1 12 6a4.6 4.6 0 0 1 8 3.6C20 15.2 12 20 12 20Z"/></svg>';
  const down = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 9 6 6 6-6"/></svg>';
  const prev = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM18 5v14L9 12z"/></svg>';
  const next = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM6 5v14l9-7z"/></svg>';
  const shuffle = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 4h4v4M3 20l6-6a4 4 0 0 0 0-5l-3-3M3 4h5l9 12h4M17 16h4v4"/></svg>';
  const repeat = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></svg>';
  const lyrics = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-4 3V7a2 2 0 0 1 2-2Z"/><path d="M8 9h8M8 12h5"/></svg>';
  const queue = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h11M4 12h8M4 17h6"/><path d="m15 12 5 3-5 3z" fill="currentColor" stroke="none"/></svg>';
  const cast = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 17h.01M3 12a6 6 0 0 1 6 6M3 7a11 11 0 0 1 11 11"/><rect x="3" y="4" width="18" height="14" rx="2"/></svg>';
  const note = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>';
  const eq = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18V6M8 18V9M12 18V4M16 18V9M20 18V6"/></svg>';

  const mini = `
    <div class="mini">
      <div class="cover c1">M</div>
      <div class="txt"><div class="t">Midnight Signals</div><div class="s">Demo Channel</div></div>
      <div class="icon-btn">${pause}</div>
      <div class="icon-btn">${next}</div>
    </div>`;

  const tabs = (active) => `
    <div class="tabs">
      <div class="tab ${active === 'home' ? 'on' : ''}">${home}<span>Home</span></div>
