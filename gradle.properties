org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP still registers its generated sources through the kotlin.sourceSets DSL,
# which AGP 9's built-in Kotlin rejects. This is Google's documented escape
# hatch for third-party processors; remove it once KSP migrates to
# android.sourceSets (see developer.android.com/build/migrate-to-built-in-kotlin).
android.disallowKotlinSourceSets=false

kotlin.code.style=official
