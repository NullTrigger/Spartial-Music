#
# Release workflow for the GMS APK. A standalone file on purpose, so each APK
# is built and published by its own workflow instead of one file building two
# APKs in a row: this one builds the gms flavour only —
# `nodes-gms-<version>.apk` — with Play services and Cast. The FOSS APK is
# built by .github/workflows/release.yml. Both workflows sign with the same
# KEYSTORE_* secrets, need the YOUTUBE_*/JAMENDO_* keys for
# `local.properties`, run on the same `v*` tags, and attach their APK plus
# its sha256 to the same GitHub Release.




name: Build Spartial Music Universal APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GMS and FOSS Universal APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing"
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/spartial-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/spartial-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" >/dev/null

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=$RUNNER_TEMP/spartial-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Configure API keys
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          {
            echo "YOUTUBE_API_KEY=$YOUTUBE_API_KEY"
            echo "YOUTUBE_OAUTH_CLIENT_ID=$YOUTUBE_OAUTH_CLIENT_ID"
            echo "JAMENDO_CLIENT_ID=$JAMENDO_CLIENT_ID"
          } > local.properties

      - name: Build GMS release
        run: ./gradlew :app:assembleGmsRelease --stacktrace

      - name: Build FOSS release
        run: ./gradlew :app:assembleFossRelease --stacktrace

      - name: Collect universal APKs
        run: |
          set -euo pipefail

          mkdir -p dist

          collect_apk() {
            FLAVOR="$1"
            OUTPUT="$2"
            DIR="app/build/outputs/apk/$FLAVOR/release"

            mapfile -t APKS < <(
              find "$DIR" -maxdepth 1 -type f -name '*.apk'
            )

            if [ "${#APKS[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one universal APK for $FLAVOR, found ${#APKS[@]}"
              exit 1
            fi

            cp "${APKS[0]}" "dist/$OUTPUT"
          }

          collect_apk gms Spartial-Music-GMS.apk
          collect_apk foss Spartial-Music-FOSS.apk

          echo "APK architecture contents:"

          for APK in dist/*.apk; do
            echo "Checking $APK"

            LIBS=$(unzip -Z1 "$APK" | grep '^lib/' || true)

            if [ -n "$LIBS" ]; then
              echo "$LIBS" | cut -d/ -f2 | sort -u
            else
              echo "No packaged native libraries."
            fi
          done

          ls -lh dist

      - name: Verify APK signatures
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"

          for APK in dist/*.apk; do
            echo "Verifying $APK"

            "$APKSIGNER" verify --verbose --print-certs "$APK"
          done

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload universal APKs
        uses: actions/upload-artifact@v4
        with:
          name: Spartial-Music-Universal-APKs
          path: dist/*
          if-no-files-found: error
          retention-days: 30
