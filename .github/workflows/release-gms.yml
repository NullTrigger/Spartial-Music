
name: Build Android Release APKs

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

jobs:
  prepare-version:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "${{ inputs.release_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

  build:
    name: Build ${{ matrix.flavor }} APK
    needs: prepare-version
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: gms
            task_flavor: Gms
          - flavor: foss
            task_flavor: Foss

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "Android SDK: $SDK"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            find "$SDK/cmdline-tools" -maxdepth 4 -type f || true
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          echo "Accepting Android SDK licenses..."

          set +o pipefail
          yes 2>/dev/null | "$SDKMANAGER" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed."
            exit "$LICENSE_STATUS"
          fi

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "build-tools;37.0.0" \
            "platforms;android-37.0"

          echo "Installed SDK packages:"
          "$SDKMANAGER" --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Update application version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-version.outputs.version }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          content = path.read_text()
          version = os.environ["RELEASE_VERSION"]

          content, name_count = re.subn(
              r'versionName = "[^"]+"',
              f'versionName = "{version}"',
              content,
              count=1
          )

          content, parts_count = re.subn(
              r'(val parts = ")[^"]+(")',
              lambda m: m.group(1) + version + m.group(2),
              content,
              count=1
          )

          if name_count != 1 or parts_count != 1:
              raise SystemExit(
                  "Could not safely update versionName/versionCode calculation."
              )

          path.write_text(content)
          print(f"Application version updated to {version}")
          PY

      - name: Configure YouTube API
        shell: bash
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "${YOUTUBE_API_KEY:-}" ]; then
            echo "YOUTUBE_API_KEY=$YOUTUBE_API_KEY" >> local.properties
          else
            echo "YouTube API key not configured; continuing."
          fi

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for secret in \
            ANDROID_SIGNING_KEY \
            ANDROID_KEY_ALIAS \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!secret:-}" ]; then
              echo "::error::$secret is missing."
              exit 1
            fi
          done

          echo "All signing secrets are configured."

      - name: Grant Gradle wrapper permission
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon \
            ":app:lint${{ matrix.task_flavor }}Release" \
            ":app:assemble${{ matrix.task_flavor }}Release"

      - name: Sign release APK
        uses: ilharp/sign-android-release@v2
        id: sign
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.flavor }}/release
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: "37.0.0"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Spartial-Music-${{ matrix.flavor }}-${{ needs.prepare-version.outputs.version }}
          path: ${{ steps.sign.outputs.signedReleaseFile }}
          if-no-files-found: error
          retention-days: 30
