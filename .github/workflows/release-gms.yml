#
# Release workflow for the GMS APK. A standalone file on purpose, so each APK
# is built and published by its own workflow instead of one file building two
# APKs in a row: this one builds the gms flavour only —
# `nodes-gms-<version>.apk` — with Play services and Cast. The FOSS APK is
# built by .github/workflows/release.yml. Both workflows sign with the same
# KEYSTORE_* secrets, need the YOUTUBE_*/JAMENDO_* keys for
# `local.properties`, run on the same `v*` tags, and attach their APK plus
# its sha256 to the same GitHub Release.



name: Build Spartial Music Full APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Full GMS and FOSS APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "platform-tools"

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing"
              exit 1
            fi
          done

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release-key.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/release-key.jks" \
            -storepass "$KEYSTORE_PASSWORD" >/dev/null

      - name: Configure signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=$RUNNER_TEMP/release-key.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Configure API keys
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          {
            echo "YOUTUBE_API_KEY=$YOUTUBE_API_KEY"
            echo "YOUTUBE_OAUTH_CLIENT_ID=$YOUTUBE_OAUTH_CLIENT_ID"
            echo "JAMENDO_CLIENT_ID=$JAMENDO_CLIENT_ID"
          } > local.properties

      # Build without minification or resource shrinking.
      # These flags preserve release build signing and other settings.
      - name: Build full GMS APK
        run: |
          ./gradlew :app:assembleGmsRelease \
            -Pandroid.enableR8=false \
            --stacktrace

      - name: Build full FOSS APK
        run: |
          ./gradlew :app:assembleFossRelease \
            -Pandroid.enableR8=false \
            --stacktrace

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist

          find app/build/outputs/apk/gms/release \
            -maxdepth 1 -name '*.apk' -exec cp {} dist/ \;

          find app/build/outputs/apk/foss/release \
            -maxdepth 1 -name '*.apk' -exec cp {} dist/ \;

          mapfile -t APKS < <(find dist -maxdepth 1 -name '*.apk')

          if [ "${#APKS[@]}" -lt 2 ]; then
            echo "::error::Expected GMS and FOSS APKs"
            exit 1
          fi

          GMS=$(find dist -maxdepth 1 -name '*gms*' -print -quit)
          FOSS=$(find dist -maxdepth 1 -name '*foss*' -print -quit)

          if [ -z "$GMS" ] || [ -z "$FOSS" ]; then
            echo "::error::Could not identify both APK variants"
            exit 1
          fi

          mv "$GMS" dist/Spartial-Music-GMS.apk
          mv "$FOSS" dist/Spartial-Music-FOSS.apk

          ls -lh dist

      - name: Verify signatures
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"

          for APK in dist/*.apk; do
            "$APKSIGNER" verify --verbose "$APK"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spartial-Music-Full-APKs
          path: dist/*
          if-no-files-found: error
          retention-days: 30
