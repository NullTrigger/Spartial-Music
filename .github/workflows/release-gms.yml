#
# Manual APK build workflow for Spartial Music.
# Builds and signs GMS and FOSS release APKs.
# Uploads APKs as workflow artifacts only.
# Does not publish a GitHub Release, push a tag, or commit changes.

name: Spartial Music Build

run-name: Spartial Music Build (${{ inputs.release_type }})

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Choose the version increment."
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: spartial-music-release
  cancel-in-progress: false

jobs:
  prepare-version:
    name: Calculate Release Version
    runs-on: ubuntu-latest

    outputs:
      current_version: ${{ steps.version.outputs.current_version }}
      new_version: ${{ steps.version.outputs.new_version }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Calculate next version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          python3 - <<'PY'
          import os
          import re

          path = "app/build.gradle.kts"
          with open(path, encoding="utf-8") as f:
              content = f.read()

          match = re.search(
              r'versionName\s*=\s*"(\d+)\.(\d+)\.(\d+)"',
              content
          )
          if not match:
              raise SystemExit("Could not find versionName")

          major, minor, patch = map(int, match.groups())
          current = f"{major}.{minor}.{patch}"

          release_type = os.environ["RELEASE_TYPE"]

          if release_type == "patch":
              patch += 1
          elif release_type == "minor":
              minor += 1
              patch = 0
          elif release_type == "major":
              major += 1
              minor = 0
              patch = 0
          else:
              raise SystemExit("Invalid release type")

          new = f"{major}.{minor}.{patch}"
          code = major * 10000 + minor * 100 + patch

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"current_version={current}\n")
              f.write(f"new_version={new}\n")
              f.write(f"version_code={code}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("# Spartial Music Release Preview\n\n")
              f.write(f"- Current version: `{current}`\n")
              f.write(f"- Release type: **{release_type}**\n")
              f.write(f"- New version: **{new}**\n")
              f.write(f"- Version code: `{code}`\n")
          PY

  build:
    name: Build ${{ matrix.variant }} APK
    needs: prepare-version
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: GMS
            gradle_variant: Gms
            apk_name: Spartial-Music-GMS.apk

          - variant: FOSS
            gradle_variant: Foss
            apk_name: Spartial-Music-FOSS.apk

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/22.0/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi

          set +o pipefail
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply release version
        env:
          VERSION: ${{ needs.prepare-version.outputs.new_version }}
          VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
        run: |
          python3 - <<'PY'
          import os
          import re

          path = "app/build.gradle.kts"
          with open(path, encoding="utf-8") as f:
              content = f.read()

          content, name_count = re.subn(
              r'(versionName\s*=\s*")[^"]+(")',
              rf'\g<1>{os.environ["VERSION"]}\g<2>',
              content,
              count=1
          )

          content, code_count = re.subn(
              r'versionCode\s*=\s*run\s*\{.*?\n\s*\}',
              f'versionCode = {os.environ["VERSION_CODE"]}',
              content,
              count=1,
              flags=re.DOTALL
          )

          if name_count != 1 or code_count != 1:
              raise SystemExit("Could not update version fields")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Configure YouTube API key
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          echo "YOUTUBE_API_KEY=$YOUTUBE_API_KEY" >> local.properties

      - name: Verify signing secrets
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$SIGNING_KEY" || {
            echo "::error::ANDROID_SIGNING_KEY is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "::error::ANDROID_KEY_ALIAS is missing"
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "::error::ANDROID_KEYSTORE_PASSWORD is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "::error::ANDROID_KEY_PASSWORD is missing"
            exit 1
          }

          echo "All Android signing secrets are available."

      - name: Build and lint ${{ matrix.variant }}
        run: |
          chmod +x gradlew

          ./gradlew \
            :app:lint${{ matrix.gradle_variant }}Release \
            :app:assemble${{ matrix.gradle_variant }}Release \
            --stacktrace

      - name: Sign APK
        id: sign
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant == 'GMS' && 'gms' || 'foss' }}/release
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: "36.0.0"

      - name: Prepare APK
        env:
          SIGNED_FILE: ${{ steps.sign.outputs.signedFile }}
          APK_NAME: ${{ matrix.apk_name }}
        run: |
          set -euo pipefail

          if [ -z "$SIGNED_FILE" ] || [ ! -f "$SIGNED_FILE" ]; then
            echo "::error::Signed APK was not found"
            exit 1
          fi

          cp "$SIGNED_FILE" "$APK_NAME"
          ls -lh "$APK_NAME"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'GMS' && 'Spartial-Music-GMS' || 'Spartial-Music-FOSS' }}
          path: ${{ matrix.apk_name }}
          if-no-files-found: error
          retention-days: 30

  build-summary:
    name: Build Complete (Manual Publishing)
    needs:
      - prepare-version
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Show artifact instructions
        env:
          VERSION: ${{ needs.prepare-version.outputs.new_version }}
          VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
        run: |
          {
            echo "# APK Build Complete"
            echo ""
            echo "**Version:** $VERSION"
            echo ""
            echo "**Version code:** $VERSION_CODE"
            echo ""
            echo "## Downloaded artifacts"
            echo "- Spartial-Music-GMS"
            echo "- Spartial-Music-FOSS"
            echo ""
            echo "Download the artifacts and publish your GitHub Release manually."
            echo ""
            echo "No release, tag, or repository commit was created."
          } >> "$GITHUB_STEP_SUMMARY"
