#
# Release workflow for the GMS APK. A standalone file on purpose, so each APK
# is built and published by its own workflow instead of one file building two
# APKs in a row: this one builds the gms flavour only —
# `nodes-gms-<version>.apk` — with Play services and Cast. The FOSS APK is
# built by .github/workflows/release.yml. Both workflows sign with the same
# KEYSTORE_* secrets, need the YOUTUBE_*/JAMENDO_* keys for
# `local.properties`, run on the same `v*` tags, and attach their APK plus
# its sha256 to the same GitHub Release.

name: Build Spartial Music GMS APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build GMS APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/nodes-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/nodes-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            > /dev/null

      - name: Write signing config
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/nodes-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Write local.properties
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          {
            echo "YOUTUBE_API_KEY=$YOUTUBE_API_KEY"
            echo "YOUTUBE_OAUTH_CLIENT_ID=$YOUTUBE_OAUTH_CLIENT_ID"
            echo "JAMENDO_CLIENT_ID=$JAMENDO_CLIENT_ID"
          } > local.properties

      - name: Assemble GMS release
        run: ./gradlew :app:assembleGmsRelease --stacktrace

      - name: Collect APK
        id: artifacts
        run: |
          set -euo pipefail

          mkdir -p dist

          APK=$(find app/build/outputs/apk/gms/release \
            -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::No GMS release APK found."
            exit 1
          fi

          cp "$APK" dist/Spartial-Music-GMS.apk

          cd dist
          sha256sum Spartial-Music-GMS.apk \
            > Spartial-Music-GMS.apk.sha256

          ls -lh

      - name: Signing check
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"

          for APK in dist/*.apk; do
            echo "Checking $APK"

            if ! "$BUILD_TOOLS/apksigner" verify \
              --verbose --print-certs "$APK"; then
              echo "::error::APK signature verification failed."
              exit 1
            fi

            echo "APK signature verified successfully."
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spartial-Music-GMS-APK
          path: |
            dist/Spartial-Music-GMS.apk
            dist/Spartial-Music-GMS.apk.sha256
          if-no-files-found: error
          retention-days: 30
