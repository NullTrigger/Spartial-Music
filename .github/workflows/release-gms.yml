#
# Manual APK build workflow for Spartial Music.
# Builds and signs GMS and FOSS release APKs, then uploads them as workflow
# artifacts. It does not publish a GitHub Release, push a tag, or commit changes.





name: Spartial Music Build

run-name: Spartial Music Build (${{ inputs.release_type }})

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Choose the version increment. The current and next versions will appear in the run summary."
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: spartial-music-release
  cancel-in-progress: false

jobs:
  prepare-version:
    name: Calculate Release Version
    runs-on: ubuntu-latest

    outputs:
      current_version: ${{ steps.version.outputs.current_version }}
      new_version: ${{ steps.version.outputs.new_version }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Calculate next version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          python3 - <<'PY'
          import os
          import re

          path = "app/build.gradle.kts"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          code_match = re.search(r'versionCode\s*=\s*(\d+)', content)
          name_match = re.search(r'versionName\s*=\s*"(\d+)\.(\d+)\.(\d+)"', content)

          if not code_match or not name_match:
              raise SystemExit(
                  "Could not find versionCode or MAJOR.MINOR.PATCH versionName "
                  "in app/build.gradle.kts"
              )

          version_code = int(code_match.group(1)) + 1
          major, minor, patch = map(int, name_match.groups())
          current_version = f"{major}.{minor}.{patch}"

          release_type = os.environ["RELEASE_TYPE"]

          if release_type == "patch":
              patch += 1
          elif release_type == "minor":
              minor += 1
              patch = 0
          elif release_type == "major":
              major += 1
              minor = 0
              patch = 0
          else:
              raise SystemExit("Invalid release type")

          new_version = f"{major}.{minor}.{patch}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"current_version={current_version}\n")
              f.write(f"new_version={new_version}\n")
              f.write(f"version_code={version_code}\n")

          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a") as f:
              f.write("# Spartial Music Release Preview\n\n")
              f.write(f"| Detail | Value |\n")
              f.write(f"|---|---|\n")
              f.write(f"| Current version | `{current_version}` |\n")
              f.write(f"| Release type | **{release_type.capitalize()}** |\n")
              f.write(f"| New version | **`{new_version}`** |\n")
              f.write(f"| New versionCode | `{version_code}` |\n")
          PY

      - name: Show release version
        run: |
          echo "Current: ${{ steps.version.outputs.current_version }}"
          echo "New: ${{ steps.version.outputs.new_version }}"

  build:
    name: Build ${{ matrix.variant }} APK
    needs: prepare-version
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: GMS
            gradle_variant: Gms
            apk_name: Spartial-Music-GMS.apk

          - variant: FOSS
            gradle_variant: Foss
            apk_name: Spartial-Music-FOSS.apk

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply release version
        env:
          VERSION: ${{ needs.prepare-version.outputs.new_version }}
          VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
        run: |
          python3 - <<'PY'
          import os
          import re

          path = "app/build.gradle.kts"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          content, code_count = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {os.environ["VERSION_CODE"]}',
              content,
              count=1
          )

          content, name_count = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              f'versionName = "{os.environ["VERSION"]}"',
              content,
              count=1
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not update versionCode/versionName")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Configure YouTube API key
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          echo "YOUTUBE_API_KEY=$YOUTUBE_API_KEY" > local.properties

      - name: Build and lint ${{ matrix.variant }}
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:lint${{ matrix.gradle_variant }}Release \
            :app:assemble${{ matrix.gradle_variant }}Release

      - name: Sign APK
        id: sign
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant == 'GMS' && 'gms' || 'foss' }}/release
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: "37.0.0"

      - name: Prepare APK
        env:
          SIGNED_FILE: ${{ steps.sign.outputs.signedFile }}
          APK_NAME: ${{ matrix.apk_name }}
        run: |
          if [ -z "$SIGNED_FILE" ] || [ ! -f "$SIGNED_FILE" ]; then
            echo "Signed APK was not found."
            exit 1
          fi

          cp "$SIGNED_FILE" "$APK_NAME"

          echo "APK: $APK_NAME"
          ls -lh "$APK_NAME"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'GMS' && 'Spartial-Music-GMS' || 'Spartial-Music-FOSS' }}
          path: ${{ matrix.apk_name }}
          if-no-files-found: error
          retention-days: 30


  build-summary:
    name: Build Complete (Manual Publishing)
    needs:
      - prepare-version
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Show artifact instructions
        env:
          VERSION: ${{ needs.prepare-version.outputs.new_version }}
          VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
        run: |
          {
            echo "# APK Build Complete"
            echo ""
            echo "**Version:** $VERSION"
            echo ""
            echo "**Version code:** $VERSION_CODE"
            echo ""
            echo "## Downloaded artifacts"
            echo "- \`Spartial-Music-GMS\` — signed GMS APK"
            echo "- \`Spartial-Music-FOSS\` — signed FOSS APK"
            echo ""
            echo "## Manual publishing"
            echo "Download the two APK artifacts from this workflow run, then create your GitHub Release manually and attach the APK files."
            echo ""
            echo "This workflow does not create a GitHub Release, push a tag, or commit version changes."
          } >> "$GITHUB_STEP_SUMMARY"
