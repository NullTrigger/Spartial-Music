#
# Release workflow for the GMS APK. A standalone file on purpose, so each APK
# is built and published by its own workflow instead of one file building two
# APKs in a row: this one builds the gms flavour only —
# `nodes-gms-<version>.apk` — with Play services and Cast. The FOSS APK is
# built by .github/workflows/release.yml. Both workflows sign with the same
# KEYSTORE_* secrets, need the YOUTUBE_*/JAMENDO_* keys for
# `local.properties`, run on the same `v*` tags, and attach their APK plus
# its sha256 to the same GitHub Release.






name: Spartial Music Release

run-name: Spartial Music Release (${{ inputs.release_type }})

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Choose the version increment. The current and next versions will appear in the run summary."
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: spartial-music-release
  cancel-in-progress: false

jobs:
  prepare-version:
    name: Calculate Release Version
    runs-on: ubuntu-latest

    outputs:
      current_version: ${{ steps.version.outputs.current_version }}
      new_version: ${{ steps.version.outputs.new_version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      base_sha: ${{ steps.version.outputs.base_sha }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Calculate next version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          path = "app/build.gradle.kts"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          code_match = re.search(r'versionCode\s*=\s*(\d+)', content)
          name_match = re.search(r'versionName\s*=\s*"(\d+)\.(\d+)\.(\d+)"', content)

          if not code_match or not name_match:
              raise SystemExit(
                  "Could not find versionCode or MAJOR.MINOR.PATCH versionName "
                  "in app/build.gradle.kts"
              )

          version_code = int(code_match.group(1)) + 1
          major, minor, patch = map(int, name_match.groups())
          current_version = f"{major}.{minor}.{patch}"

          release_type = os.environ["RELEASE_TYPE"]

          if release_type == "patch":
              patch += 1
          elif release_type == "minor":
              minor += 1
              patch = 0
          elif release_type == "major":
              major += 1
              minor = 0
              patch = 0
          else:
              raise SystemExit("Invalid release type")

          new_version = f"{major}.{minor}.{patch}"
          tag = f"v{new_version}"
          base_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"current_version={current_version}\n")
              f.write(f"new_version={new_version}\n")
              f.write(f"version_code={version_code}\n")
              f.write(f"tag={tag}\n")
              f.write(f"base_sha={base_sha}\n")

          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a") as f:
              f.write("# Spartial Music Release Preview\n\n")
              f.write(f"| Detail | Value |\n")
              f.write(f"|---|---|\n")
              f.write(f"| Current version | `{current_version}` |\n")
              f.write(f"| Release type | **{release_type.capitalize()}** |\n")
              f.write(f"| New version | **`{new_version}`** |\n")
              f.write(f"| New versionCode | `{version_code}` |\n")
              f.write(f"| Git tag | `{tag}` |\n")
          PY

      - name: Show release version
        run: |
          echo "Current: ${{ steps.version.outputs.current_version }}"
          echo "New: ${{ steps.version.outputs.new_version }}"
          echo "Tag: ${{ steps.version.outputs.tag }}"

  build:
    name: Build ${{ matrix.variant }} APK
    needs: prepare-version
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: GMS
            gradle_variant: Gms
            apk_name: Spartial-Music-GMS.apk

          - variant: FOSS
            gradle_variant: Foss
            apk_name: Spartial-Music-FOSS.apk

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.base_sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply release version
        env:
          VERSION: ${{ needs.prepare-version.outputs.new_version }}
          VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
        run: |
          python3 - <<'PY'
          import os
          import re

          path = "app/build.gradle.kts"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          content, code_count = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {os.environ["VERSION_CODE"]}',
              content,
              count=1
          )

          content, name_count = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              f'versionName = "{os.environ["VERSION"]}"',
              content,
              count=1
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not update versionCode/versionName")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Configure YouTube API key
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          echo "YOUTUBE_API_KEY=$YOUTUBE_API_KEY" > local.properties

      - name: Build and lint ${{ matrix.variant }}
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:lint${{ matrix.gradle_variant }}Release \
            :app:assemble${{ matrix.gradle_variant }}Release

      - name: Sign APK
        id: sign
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant == 'GMS' && 'gms' || 'foss' }}/release
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: "37.0.0"

      - name: Prepare APK
        env:
          SIGNED_FILE: ${{ steps.sign.outputs.signedFile }}
          APK_NAME: ${{ matrix.apk_name }}
        run: |
          if [ -z "$SIGNED_FILE" ] || [ ! -f "$SIGNED_FILE" ]; then
            echo "Signed APK was not found."
            exit 1
          fi

          cp "$SIGNED_FILE" "$APK_NAME"

          echo "APK: $APK_NAME"
          ls -lh "$APK_NAME"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'GMS' && 'Spartial-Music-GMS' || 'Spartial-Music-FOSS' }}
          path: ${{ matrix.apk_name }}
          if-no-files-found: error
          retention-days: 30

  finalize-version:
    name: Update Version and Create Tag
    needs:
      - prepare-version
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.base_sha }}
          fetch-depth: 0

      - name: Update version in Gradle
        env:
          VERSION: ${{ needs.prepare-version.outputs.new_version }}
          VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
        run: |
          python3 - <<'PY'
          import os
          import re

          path = "app/build.gradle.kts"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          content, code_count = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {os.environ["VERSION_CODE"]}',
              content,
              count=1
          )

          content, name_count = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              f'versionName = "{os.environ["VERSION"]}"',
              content,
              count=1
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not update versionCode/versionName")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Commit version and create tag
        env:
          VERSION: ${{ needs.prepare-version.outputs.new_version }}
          TAG: ${{ needs.prepare-version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/build.gradle.kts
          git commit -m "chore: release v$VERSION"

          git tag -a "$TAG" -m "Spartial Music $VERSION"

          git push --atomic origin HEAD:main "refs/tags/$TAG"

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare-version
      - finalize-version
    runs-on: ubuntu-latest

    steps:
      - name: Download GMS APK
        uses: actions/download-artifact@v4
        with:
          name: Spartial-Music-GMS
          path: artifacts/gms

      - name: Download FOSS APK
        uses: actions/download-artifact@v4
        with:
          name: Spartial-Music-FOSS
          path: artifacts/foss

      - name: Verify APK files
        run: |
          test -s artifacts/gms/Spartial-Music-GMS.apk
          test -s artifacts/foss/Spartial-Music-FOSS.apk

          ls -lh artifacts/gms/
          ls -lh artifacts/foss/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-version.outputs.new_version }}
          TAG: ${{ needs.prepare-version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            artifacts/gms/Spartial-Music-GMS.apk \
            artifacts/foss/Spartial-Music-FOSS.apk \
            --title "Spartial Music $VERSION" \
            --generate-notes \
            --latest

      - name: Release summary
        env:
          VERSION: ${{ needs.prepare-version.outputs.new_version }}
          TAG: ${{ needs.prepare-version.outputs.tag }}
        run: |
          {
            echo "# Release Published"
            echo ""
            echo "**Version:** $VERSION"
            echo ""
            echo "**Tag:** $TAG"
            echo ""
            echo "- Spartial-Music-GMS.apk"
            echo "- Spartial-Music-FOSS.apk"
          } >> "$GITHUB_STEP_SUMMARY"
