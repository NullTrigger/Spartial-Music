#
# Release workflow for the GMS APK. A standalone file on purpose, so each APK
# is built and published by its own workflow instead of one file building two
# APKs in a row: this one builds the gms flavour only —
# `nodes-gms-<version>.apk` — with Play services and Cast. The FOSS APK is
# built by .github/workflows/release.yml. Both workflows sign with the same
# KEYSTORE_* secrets, need the YOUTUBE_*/JAMENDO_* keys for
# `local.properties`, run on the same `v*` tags, and attach their APK plus
# its sha256 to the same GitHub Release.





name: Spartial Music Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Choose the version increment"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: spartial-music-release
  cancel-in-progress: false

jobs:
  prepare-version:
    name: Calculate New Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      base_sha: ${{ steps.version.outputs.base_sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Calculate version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          import subprocess

          path = "app/build.gradle.kts"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          version_match = re.search(
              r'(?m)^(\s*versionName\s*=\s*)"([^"]+)"',
              content
          )

          code_match = re.search(
              r'(?m)^(\s*versionCode\s*=\s*)(\d+)',
              content
          )

          if not version_match or not code_match:
              raise SystemExit(
                  "Could not find versionName or versionCode "
                  "in app/build.gradle.kts"
              )

          old_version = version_match.group(2)
          old_code = int(code_match.group(2))

          if not re.fullmatch(r"\d+\.\d+\.\d+", old_version):
              raise SystemExit(
                  f"Unsupported version format: {old_version}. "
                  "Expected MAJOR.MINOR.PATCH."
              )

          major, minor, patch = map(int, old_version.split("."))
          release_type = os.environ["RELEASE_TYPE"]

          if release_type == "patch":
              patch += 1
          elif release_type == "minor":
              minor += 1
              patch = 0
          elif release_type == "major":
              major += 1
              minor = 0
              patch = 0
          else:
              raise SystemExit("Invalid release type")

          new_version = f"{major}.{minor}.{patch}"
          new_code = old_code + 1
          tag = f"v{new_version}"

          base_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True
          ).strip()

          print(f"Old version: {old_version} ({old_code})")
          print(f"New version: {new_version} ({new_code})")
          print(f"Release tag: {tag}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={new_version}\n")
              f.write(f"version_code={new_code}\n")
              f.write(f"tag={tag}\n")
              f.write(f"base_sha={base_sha}\n")
          PY

  build:
    name: Build ${{ matrix.variant }} Release
    needs: prepare-version
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gms
            variantName: Gms
            apk_name: Spartial-Music-GMS.apk

          - variant: foss
            variantName: Foss
            apk_name: Spartial-Music-FOSS.apk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.base_sha }}
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Apply release version
        env:
          VERSION: ${{ needs.prepare-version.outputs.version }}
          VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
        run: |
          python3 <<'PY'
          import os
          import re

          path = "app/build.gradle.kts"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          content, version_count = re.subn(
              r'(?m)^(\s*versionName\s*=\s*)"[^"]+"',
              lambda m: m.group(1) + '"' + os.environ["VERSION"] + '"',
              content,
              count=1
          )

          content, code_count = re.subn(
              r'(?m)^(\s*versionCode\s*=\s*)\d+',
              lambda m: m.group(1) + os.environ["VERSION_CODE"],
              content,
              count=1
          )

          if version_count != 1 or code_count != 1:
              raise SystemExit("Could not update version information")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Configure API key
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          printf 'YOUTUBE_API_KEY=%s\n' "$YOUTUBE_API_KEY" > local.properties

      - name: Build and lint release APK
        run: |
          ./gradlew --console=plain \
            :app:assemble${{ matrix.variantName }}Release \
            :app:lint${{ matrix.variantName }}Release \
            --warning-mode summary

      - name: Sign Release APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant }}/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 37.0.0

      - name: Rename signed APK
        env:
          VARIANT: ${{ matrix.variant }}
          APK_NAME: ${{ matrix.apk_name }}
        run: |
          set -euo pipefail

          OUTPUT_DIR="app/build/outputs/apk/${VARIANT}/release"
          mkdir -p dist

          SIGNED_APK=$(find "$OUTPUT_DIR" \
            -maxdepth 1 -type f -name '*-signed.apk' \
            -print -quit)

          if [ -z "$SIGNED_APK" ]; then
            echo "::error::Signed APK not found"
            ls -la "$OUTPUT_DIR"
            exit 1
          fi

          cp "$SIGNED_APK" "dist/$APK_NAME"

          test -s "dist/$APK_NAME"
          ls -lh dist/

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: spartial-music-${{ matrix.variant }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  finalize-version:
    name: Commit Version and Create Tag
    needs:
      - prepare-version
      - build
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ needs.prepare-version.outputs.tag }}
      version: ${{ needs.prepare-version.outputs.version }}

    steps:
      - name: Checkout original source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.base_sha }}
          fetch-depth: 0

      - name: Update version in Gradle
        env:
          VERSION: ${{ needs.prepare-version.outputs.version }}
          VERSION_CODE: ${{ needs.prepare-version.outputs.version_code }}
        run: |
          python3 <<'PY'
          import os
          import re

          path = "app/build.gradle.kts"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          content, version_count = re.subn(
              r'(?m)^(\s*versionName\s*=\s*)"[^"]+"',
              lambda m: m.group(1) + '"' + os.environ["VERSION"] + '"',
              content,
              count=1
          )

          content, code_count = re.subn(
              r'(?m)^(\s*versionCode\s*=\s*)\d+',
              lambda m: m.group(1) + os.environ["VERSION_CODE"],
              content,
              count=1
          )

          if version_count != 1 or code_count != 1:
              raise SystemExit("Could not update version information")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Commit version and push tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-version.outputs.version }}
          TAG: ${{ needs.prepare-version.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "::error::Release tag $TAG already exists"
            exit 1
          fi

          git add app/build.gradle.kts

          git commit -m "Bump version to $VERSION"

          git tag -a "$TAG" -m "Release $TAG"

          git push --atomic origin \
            HEAD:refs/heads/main \
            "refs/tags/$TAG"

          echo "Version committed and tag $TAG pushed successfully."

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare-version
      - build
      - finalize-version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download GMS and FOSS APKs
        uses: actions/download-artifact@v4
        with:
          pattern: spartial-music-*
          path: release_files
          merge-multiple: true

      - name: Verify release APKs
        run: |
          set -euo pipefail

          test -s release_files/Spartial-Music-GMS.apk
          test -s release_files/Spartial-Music-FOSS.apk

          ls -lh release_files/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-version.outputs.version }}
          TAG: ${{ needs.finalize-version.outputs.tag }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            --title "Spartial Music $VERSION" \
            --generate-notes \
            --latest \
            release_files/Spartial-Music-GMS.apk \
            release_files/Spartial-Music-FOSS.apk

      - name: Release summary
        env:
          VERSION: ${{ needs.prepare-version.outputs.version }}
          TAG: ${{ needs.finalize-version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## Spartial Music Release"
            echo ""
            echo "- **Version:** $VERSION"
            echo "- **Tag:** $TAG"
            echo "- **GMS:** Spartial-Music-GMS.apk"
            echo "- **FOSS:** Spartial-Music-FOSS.apk"
            echo ""
            echo "[View GitHub Release](https://github.com/$REPOSITORY/releases/tag/$TAG)"
          } >> "$GITHUB_STEP_SUMMARY"
