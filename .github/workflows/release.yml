name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. A release build needs a signing key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nodes-release.jks"
          # Fail early with a clear message if the secret is not a real keystore.
          keytool -list -keystore "$RUNNER_TEMP/nodes-release.jks" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" > /dev/null

      - name: Write signing config
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/nodes-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Write local.properties
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          {
            echo "YOUTUBE_API_KEY=$YOUTUBE_API_KEY"
          } > local.properties

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect artifacts
        id: artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          cp "$APK" "dist/nodes-$VERSION.apk"
          (cd app/build/outputs/apk/release && sha256sum *.apk) > "dist/nodes-$VERSION.apk.sha256" || true
          ls -l dist

      - name: Signing check
        run: |
          APK=$(find dist -name '*.apk' | head -n 1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -i "Signer #1 certificate DN"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nodes ${{ steps.artifacts.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Signed release build of Nodes ${{ steps.artifacts.outputs.version }}.

            Install with `adb install nodes-${{ steps.artifacts.outputs.version }}.apk`
            or open the APK on your device. Verify the checksum from the
            `.sha256` file before installing.

            YouTube browsing needs your own Data API key; see YOUTUBE.md.
            Nodes is not affiliated with YouTube, Google LLC or any streaming
            service.
          files: |
            dist/nodes-${{ steps.artifacts.outputs.version }}.apk
            dist/nodes-${{ steps.artifacts.outputs.version }}.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodes-release-apk
          path: dist/*
          if-no-files-found: error
