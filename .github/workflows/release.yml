#
# Release workflow for the FOSS APK. One workflow file per APK: this file
# builds the foss flavour only — `nodes-foss-<version>.apk`. The gms APK
# (Play services + Cast) is built by its own file,
# .github/workflows/release-gms.yml, so the two APKs never share a build.
# Both workflows sign with the same KEYSTORE_* secrets, need the
# YOUTUBE_*/JAMENDO_* keys for `local.properties`, and attach their APK plus
# its sha256 to the same `v*` tag GitHub Release.
name: Release FOSS APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the FOSS APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK. Installing packages with
      # the bundled sdkmanager avoids android-actions/setup-android, which
      # runs a legacy `sdkmanager tools` call that fails on current images
      # ("Failed to find package 'tools'").
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(command -v sdkmanager); fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. A release build needs a signing key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nodes-release.jks"
          # Fail early with a clear message if the secret is not a real keystore.
          keytool -list -keystore "$RUNNER_TEMP/nodes-release.jks" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" > /dev/null

      - name: Write signing config
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/nodes-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Write local.properties
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          {
            echo "YOUTUBE_API_KEY=$YOUTUBE_API_KEY"
            echo "YOUTUBE_OAUTH_CLIENT_ID=$YOUTUBE_OAUTH_CLIENT_ID"
            echo "JAMENDO_CLIENT_ID=$JAMENDO_CLIENT_ID"
          } > local.properties

      - name: Assemble the FOSS release
        run: ./gradlew :app:assembleFossRelease --stacktrace

      - name: Collect artifacts
        id: artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          APK=$(find "app/build/outputs/apk/foss/release" -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced for the foss flavour."
            exit 1
          fi
          cp "$APK" "dist/nodes-foss-$VERSION.apk"
          (cd "app/build/outputs/apk/foss/release" && sha256sum *.apk) \
            > "dist/nodes-foss-$VERSION.apk.sha256" || true
          ls -l dist

      - name: Signing check
        run: |
          for APK in dist/*.apk; do
            BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
            echo "Checking $APK with $BUILD_TOOLS"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep -i "Signer #1 certificate DN"
          done

      - name: Create GitHub Release
        # If this and release-gms.yml race while creating the release on a
        # fresh tag, re-run the failed workflow: the release already exists
        # and simply takes the next APK upload.
        uses: softprops/action-gh-release@v2
        with:
          name: Spartial Music ${{ steps.artifacts.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Signed release build of Spartial Music ${{ steps.artifacts.outputs.version }}.

            `nodes-foss-` is the Free-Software build without any Google
            binary; `nodes-gms-`, built by the "Release GMS APK" workflow,
            adds Cast support and is for devices with Google Play services.

            Install with `adb install nodes-foss-${{ steps.artifacts.outputs.version }}.apk`
            or open the APK on your device. Verify the checksum from the
            `.sha256` file before installing.

            YouTube browsing needs your own Data API key; see YOUTUBE.md.
            Spartial Music is not affiliated with YouTube, Google LLC or any streaming
            service.
          files: |
            dist/nodes-foss-${{ steps.artifacts.outputs.version }}.apk
            dist/nodes-foss-${{ steps.artifacts.outputs.version }}.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodes-foss-release-apk
          path: dist/*
          if-no-files-found: error
